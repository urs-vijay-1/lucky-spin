<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="trophyGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="trophyGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#fbbf24" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Dark Rounded Tile -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#0f172a" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

  <!-- Trophy Cup -->
  <g filter="url(#trophyGlow)">
    <!-- Base Pedestal -->
    <path d="M 22 52 L 42 52 L 40 48 L 24 48 Z" fill="#475569" stroke="#94a3b8" stroke-width="1"/>
    <rect x="26" y="44" width="12" height="4" fill="url(#trophyGold)" rx="1"/>
    <path d="M 29 44 L 29 38 L 35 38 L 35 44 Z" fill="url(#trophyGold)"/>

    <!-- Handles -->
    <path d="M 20 18 C 12 18, 12 30, 20 32" fill="none" stroke="url(#trophyGold)" stroke-width="3" stroke-linecap="round"/>
    <path d="M 44 18 C 52 18, 52 30, 44 32" fill="none" stroke="url(#trophyGold)" stroke-width="3" stroke-linecap="round"/>

    <!-- Cup Body -->
    <path d="M 18 16 L 46 16 L 44 30 C 44 37, 39 40, 32 40 C 25 40, 20 37, 20 30 Z" fill="url(#trophyGold)" stroke="#fde047" stroke-width="1"/>
    
    <!-- Mini Lucky Wheel inside Trophy Cup -->
    <circle cx="32" cy="27" r="7.5" fill="#1e293b" stroke="#ffffff" stroke-width="1"/>
    <!-- 4 quarter wedges -->
    <path d="M 32 27 L 32 19.5 A 7.5 7.5 0 0 1 39.5 27 Z" fill="#ec4899"/>
    <path d="M 32 27 L 39.5 27 A 7.5 7.5 0 0 1 32 34.5 Z" fill="#fbbf24"/>
    <path d="M 32 27 L 32 34.5 A 7.5 7.5 0 0 1 24.5 27 Z" fill="#3b82f6"/>
    <path d="M 32 27 L 24.5 27 A 7.5 7.5 0 0 1 32 19.5 Z" fill="#8b5cf6"/>
    <circle cx="32" cy="27" r="2.2" fill="#ffffff"/>
  </g>

  <!-- Sparkles ✨ -->
  <polygon points="12,10 13.5,13.5 17,15 13.5,16.5 12,20 10.5,16.5 7,15 10.5,13.5" fill="#fde047"/>
  <polygon points="50,11 51,13 53,14 51,15 50,17 49,15 47,14 49,13" fill="#ffffff"/>
</svg>
