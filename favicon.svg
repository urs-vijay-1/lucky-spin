<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Outer Glow -->
    <filter id="wheelGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#8b5cf6" flood-opacity="0.5"/>
    </filter>
    <filter id="pointerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Gradients -->
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="pinkGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="yellowGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="needleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
  </defs>

  <!-- Outer Rim / Tyre -->
  <circle cx="32" cy="34" r="26.5" fill="#0f172a" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1.5" filter="url(#wheelGlow)"/>

  <!-- Wheel Segments (8 Vibrant Slices) -->
  <g stroke="#ffffff" stroke-width="0.8" stroke-linejoin="round">
    <!-- Slice 1: Purple -->
    <path d="M 32 34 L 32 10 A 24 24 0 0 1 48.97 17.03 Z" fill="url(#purpleGrad)"/>
    <!-- Slice 2: Yellow -->
    <path d="M 32 34 L 48.97 17.03 A 24 24 0 0 1 56 34 Z" fill="url(#yellowGrad)"/>
    <!-- Slice 3: Pink -->
    <path d="M 32 34 L 56 34 A 24 24 0 0 1 48.97 50.97 Z" fill="url(#pinkGrad)"/>
    <!-- Slice 4: Blue -->
    <path d="M 32 34 L 48.97 50.97 A 24 24 0 0 1 32 58 Z" fill="url(#blueGrad)"/>
    <!-- Slice 5: Purple (Deep) -->
    <path d="M 32 34 L 32 58 A 24 24 0 0 1 15.03 50.97 Z" fill="#6d28d9"/>
    <!-- Slice 6: Yellow (Gold) -->
    <path d="M 32 34 L 15.03 50.97 A 24 24 0 0 1 8 34 Z" fill="#f59e0b"/>
    <!-- Slice 7: Rose Pink -->
    <path d="M 32 34 L 8 34 A 24 24 0 0 1 15.03 17.03 Z" fill="#db2777"/>
    <!-- Slice 8: Cyan Blue -->
    <path d="M 32 34 L 15.03 17.03 A 24 24 0 0 1 32 10 Z" fill="#0284c7"/>
  </g>

  <!-- Rim Metallic Studs / Rivets -->
  <circle cx="32" cy="9.5" r="1.1" fill="#f8fafc"/>
  <circle cx="49.3" cy="16.7" r="1.1" fill="#f8fafc"/>
  <circle cx="56.5" cy="34" r="1.1" fill="#f8fafc"/>
  <circle cx="49.3" cy="51.3" r="1.1" fill="#f8fafc"/>
  <circle cx="32" cy="58.5" r="1.1" fill="#f8fafc"/>
  <circle cx="14.7" cy="51.3" r="1.1" fill="#f8fafc"/>
  <circle cx="7.5" cy="34" r="1.1" fill="#f8fafc"/>
  <circle cx="14.7" cy="16.7" r="1.1" fill="#f8fafc"/>

  <!-- Center Hub with Layered Bevel and Sparkle -->
  <circle cx="32" cy="34" r="7" fill="#0f172a" stroke="#ffffff" stroke-width="1.2"/>
  <circle cx="32" cy="34" r="5" fill="url(#goldGrad)"/>
  <!-- Center Star ✨ -->
  <polygon points="32,30.5 33.2,33 35.8,34 33.2,35 32,37.5 30.8,35 28.2,34 30.8,33" fill="#ffffff"/>

  <!-- Top Fixed Pointer Needle (12 o'clock) -->
  <g filter="url(#pointerShadow)">
    <polygon points="26,2 38,2 32,13" fill="url(#needleGrad)" stroke="#ffffff" stroke-width="0.8" stroke-linejoin="round"/>
    <!-- Inner Gold Arrow Accent -->
    <polygon points="28.5,3 35.5,3 32,10" fill="#fbbf24"/>
    <!-- Pointer Pin -->
    <circle cx="32" cy="3.5" r="2.2" fill="#f8fafc" stroke="#475569" stroke-width="0.6"/>
  </g>
</svg>
